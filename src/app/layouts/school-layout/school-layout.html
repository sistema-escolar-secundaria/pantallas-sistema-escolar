<mat-sidenav-container class="school-shell">
  <mat-sidenav
    id="school-menu"
    class="sidebar"
    [mode]="compact() ? 'over' : 'side'"
    [opened]="!compact() || menuOpen()"
    (closedStart)="menuOpen.set(false)"
  >
    <a class="brand" [routerLink]="dashboard" (click)="menuOpen.set(false)">
      <img src="colegio.svg" alt="" width="42" height="42" />
      <span>Gestión Escolar<small>Primaria y Secundaria</small></span>
    </a>

    <nav [attr.aria-label]="'Menú · ' + profile.label">
      @for (module of modules; track module.path) {
        <a
          class="nav-link"
          [routerLink]="['/', role, module.path]"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="menuOpen.set(false)"
        >
          <app-school-icon [name]="module.path === 'dashboard' ? 'dashboard' : 'module'" />
          <span>{{ module.title }}</span>
        </a>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <header class="header">
      <div class="header-leading">
        @if (compact()) {
          <button
            matIconButton
            type="button"
            aria-controls="school-menu"
            [attr.aria-expanded]="menuOpen()"
            aria-label="Abrir menú"
            (click)="menuOpen.set(true)"
          >
            <app-school-icon name="menu" />
          </button>
        }
        <span class="header-label">{{ profile.label }}</span>
      </div>

      <div class="account">
        <span class="account-name">{{ profile.name }}</span>
        <button
          matButton
          class="sign-out"
          type="button"
          (click)="signOut()"
          aria-label="Cerrar sesión"
          title="Cerrar sesión"
        >
          <app-school-icon name="logout" />
          <span>Cerrar sesión</span>
        </button>
      </div>
    </header>

    <main class="page">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
